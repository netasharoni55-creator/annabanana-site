backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/annabanana-site
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "works"
    label: "Artworks"
    files:
      - name: "works"
        label: "All Works"
        file: "data/works.json"
        fields:
          - label: "Works"
            name: "works"
            widget: "list"
            summary: "{{fields.mono}}"
            fields:
              - label: "Title (MoNo ID)"
                name: "mono"
                widget: "string"
                hint: "Format: MoNo.MM.DD.YYYY-## (e.g. MoNo.09.05.2026-01)"
              - label: "Collection Code"
                name: "collection_code"
                widget: "string"
                hint: "Format: AB.YYYY.MM.DD — one code per batch/session date"
              - label: "Date"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                required: false
                hint: "Leave blank to show the default: From 100 × 70 cm"
              - label: "Medium"
                name: "medium"
                widget: "string"
                default: "Acrylic, monoprint, photograph"
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Sold"
                name: "sold"
                widget: "boolean"
                default: false
                hint: "Check this once the piece has sold — a subtle 'Sold' tag will appear on the site."
